name: Vérification du respect des spécifications

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          ${{ runner.os }}-
    - name: Installation des dépendances
      run: pip install -r requirements.txt
    - name: Vérification des schémas et exemples
      run: |
        frictionless validate --type schema plans/schema.json
        frictionless validate --schema plans/schema.json plans/exemple-valide.csv
        frictionless validate --type schema actions/schema.json
        frictionless validate --schema actions/schema.json actions/exemple-valide.csv
        frictionless validate --type schema operations/schema.json
        frictionless validate --schema operations/schema.json operations/exemple-valide.csv
        frictionless validate --type schema financements/schema.json
        frictionless validate --schema financements/schema.json financements/exemple-valide.csv
    - name: Vérification du datapackage
      run: frictionless validate datapackage.json
